<!doctype html>
<html lang="nl-BE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f8f4">
<title>Axioma · Leraar</title>
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<style>
:root{--bg:#f7f8f4;--surface:#fff;--ink:#193c43;--muted:#6a7f82;--line:#d9e2dd;--accent:#285f55;--soft:#edf2ee;--good:#3b8062;--max:1380px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit;color:inherit}a{color:inherit}
header{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 max(18px,calc((100vw - var(--max))/2));gap:18px;position:sticky;top:0;background:rgba(247,248,244,.94);backdrop-filter:blur(12px);z-index:5}
.brand{font-size:25px;font-weight:950;letter-spacing:-.055em;text-decoration:none}.brand span{color:#96ad7d}.crumb{color:var(--muted);font-size:13px}.spacer{flex:1}.account{font-size:12px;color:var(--muted)}
main{width:min(var(--max),calc(100% - 36px));margin:auto;padding:30px 0 50px}.head{display:flex;justify-content:space-between;align-items:end;gap:20px;padding-bottom:24px;border-bottom:1px solid var(--line)}.eyebrow{margin:0 0 8px;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}h1{margin:0;font-size:clamp(34px,4vw,58px);letter-spacing:-.055em}.head p{margin:10px 0 0;color:var(--muted);font-size:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{min-height:42px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:0 14px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.toolbar{display:grid;grid-template-columns:180px minmax(220px,1fr) auto auto;gap:10px;align-items:end;padding:22px 0}.toolbar label{display:grid;gap:6px;font-size:11px;font-weight:700;color:var(--muted)}.toolbar input,.toolbar select{min-height:43px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px}
.summary{font-size:13px;color:var(--muted);margin:0 0 12px}.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:13px;background:var(--surface)}table{border-collapse:collapse;width:100%;min-width:920px}th,td{text-align:left;padding:13px 14px;border-bottom:1px solid var(--line);font-size:12px}th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:var(--soft)}tbody tr:last-child td{border-bottom:0}td strong{font-size:13px}.view{border:1px solid var(--line);border-radius:7px;background:transparent;padding:7px 10px;cursor:pointer}
.detail{margin-top:18px;border-top:1px solid var(--line);padding-top:22px}.detail:empty{display:none}.detailHead{display:flex;justify-content:space-between;align-items:center;gap:12px}.detail h2{font-size:28px;margin:0}.detailGrid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(260px,.8fr);gap:36px;margin-top:18px}.skill{display:grid;grid-template-columns:minmax(180px,1fr) minmax(120px,.55fr) 46px;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);font-size:12px}.meter{height:4px;background:var(--line);border-radius:4px;overflow:hidden}.meter i{display:block;height:100%;background:var(--good)}.pct{text-align:right;color:var(--muted)}.recent{padding:10px 0;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.recent strong{color:var(--ink);display:block;margin-bottom:3px}.gameRegistry{display:flex;gap:9px;overflow:auto;padding:4px 0 16px}
.gameChip{min-width:185px;border:1px solid var(--line);border-radius:11px;background:var(--surface);padding:12px 13px}
.gameChip span,.gameChip small{display:block;color:var(--muted);font-size:10px}.gameChip span{text-transform:uppercase;letter-spacing:.08em;font-weight:800;margin-bottom:5px}.gameChip strong{font-size:14px}.gameChip small{margin-top:5px}
.matrixTable th small,.matrixTable td small{display:block;color:var(--muted);font-weight:400;margin-top:4px;white-space:nowrap}
.studentGames{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}.gameDetailCard{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:16px}.gameDetailHead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.gameDetailHead h3{margin:0;font-size:21px}.gameDetailHead>strong{font-size:23px}.skillList{margin-top:12px}.skill{display:grid;grid-template-columns:minmax(145px,1fr) 100px 38px;gap:9px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:11px}.skill em{font-style:normal;text-align:right;color:var(--muted)}.meter{height:4px;background:var(--line);border-radius:4px;overflow:hidden}.meter i{display:block;height:100%;background:var(--good)}.statePreview{max-height:180px;overflow:auto;background:var(--soft);padding:10px;border-radius:8px;font-size:10px;white-space:pre-wrap}
.state{padding:60px 0;text-align:center;color:var(--muted)}.state h2{color:var(--ink)}
@media(max-width:900px){.studentGames{grid-template-columns:1fr}}@media(max-width:760px){header{height:56px;padding-inline:12px}.crumb{display:none}main{width:calc(100% - 24px);padding-top:18px}.head{display:block}.actions{margin-top:18px}.toolbar{grid-template-columns:1fr 1fr}.toolbar .wide{grid-column:1/-1}.detailGrid{grid-template-columns:1fr}.skill{grid-template-columns:1fr 90px 38px}}
</style>
<script src="../shared/vendor/supabase.js" defer></script>
<script src="../shared/supabase-config.js" defer></script>
<script src="../shared/axioma-auth.js" defer></script>
<script src="../shared/axioma-progress.js" defer></script>
<script src="teacher.js" defer></script>
</head>
<body>
<header><a class="brand" href="../">axioma<span>.</span></a><span class="crumb">Leraarmodus</span><div class="spacer"></div><span id="teacherIdentity" class="account"></span></header>
<main>
  <section class="head">
    <div><p class="eyebrow">Axioma · leraar</p><h1>Mijn klassen</h1><p>Centraal overzicht. Momenteel toont dit de bestaande Rechtentrainer-voortgang.</p></div>
    <div class="actions"><a class="btn" href="../">← Startpagina</a><button id="logout" class="btn" type="button">Uitloggen</button></div>
  </section>
  <section id="app"><div class="state"><p>Account controleren…</p></div></section>
</main>
</body>
</html>
