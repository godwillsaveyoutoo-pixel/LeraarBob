<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Axioma · Stelsels — hardened/refactor v4</title>
<style>
:root{
  --paper:#f6f2e8; --ink:#3f4e51; --muted:#7a8584; --line:#d8d4c8;
  --panel:rgba(255,255,255,.30); --green:#5f8f69; --green-soft:#dff1c8;
  --blue:#4f91aa; --blue-soft:#cfeef7; --yellow:#f3e88e; --orange:#ffd5a5;
  --phase-soft:#d8f3a5; --shadow:0 10px 24px rgba(64,69,61,.08);
  --sans:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --hand:"Comic Sans MS","Segoe Print","Bradley Hand",cursive;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--sans)}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
#app{width:100%;height:100dvh;display:grid;grid-template-rows:48px minmax(0,1fr);background:
 linear-gradient(rgba(88,98,89,.035) 1px,transparent 1px),
 linear-gradient(90deg,rgba(88,98,89,.035) 1px,transparent 1px);
 background-size:28px 28px}
header{display:flex;align-items:center;gap:12px;padding:0 12px;border-bottom:1px solid rgba(70,80,79,.12);background:rgba(247,244,236,.92);z-index:5}
.brand{font-weight:900;letter-spacing:.12em;font-size:11px;color:#556568}
.title-row{display:flex;align-items:center;gap:12px;min-width:0}
.title{font-weight:850;font-size:15px;white-space:nowrap}
.exercise-picker{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:800;color:var(--muted)}
.exercise-picker select{height:28px;min-width:48px;border:1px solid rgba(63,76,79,.16);border-radius:7px;background:rgba(255,255,255,.45);padding:0 6px;font-weight:850}
.method-tabs{display:flex;align-items:center;gap:3px;margin-left:auto}
.method-tab{border:0;background:transparent;border-radius:8px;padding:7px 9px;font-size:11px;font-weight:800;color:#7d8786}
.method-tab.active{background:rgba(79,145,170,.10);color:#42585d}
.icon-btn{border:0;background:transparent;border-radius:8px;width:34px;height:32px;font-size:18px;color:#6c7776}
.icon-btn:disabled{opacity:.25}

.study-mode{display:flex;align-items:center;gap:2px;padding:2px;border:1px solid rgba(63,76,79,.10);border-radius:10px;background:rgba(255,255,255,.34)}
.study-mode-btn{border:0;background:transparent;border-radius:8px;padding:6px 8px;font-size:10px;font-weight:850;color:#788481}
.study-mode-btn.active{background:rgba(216,243,165,.68);color:#43544f}

.expert-workspace{
  width:min(1080px,99%);height:100%;min-height:0;
  display:grid;grid-template-columns:minmax(0,1fr) 224px;gap:14px;align-items:center
}
.expert-main{min-width:0;min-height:0;display:grid;align-content:center;gap:8px}
.expert-original{display:grid;justify-items:center;gap:3px}
.expert-label{font-size:8px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#7a8784}
.expert-original .system{max-width:94%}
.expert-original .brace{font-size:clamp(86px,10vw,130px)}
.expert-original .eq-row{font-size:clamp(25px,3vw,38px);min-height:43px}
.expert-task{
  display:grid;justify-items:center;gap:8px;padding:8px 10px 7px;
  border-top:1px solid rgba(70,80,79,.08)
}
.expert-task-title{font-size:11px;font-weight:850;color:#596a68;text-align:center}
.expert-equation{
  display:grid;grid-template-columns:minmax(90px,auto) 27px minmax(120px,auto);
  gap:4px;align-items:center;font-size:clamp(24px,3vw,36px);font-weight:720;
  font-family:var(--sans);white-space:nowrap
}
.expert-equation .left{text-align:right}.expert-equation .eq{text-align:center;color:#72807e}.expert-equation .right{text-align:left}
.expert-two-rows{display:grid;gap:7px}
.expert-factor-system{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;font-family:var(--hand)}
.expert-factor-brace{font-family:Georgia,serif;font-size:92px;line-height:.68;transform:scaleY(1.08);color:#506064}
.expert-factor-rows{display:grid;gap:8px}
.expert-factor-row{display:grid;grid-template-columns:minmax(115px,auto) 24px minmax(64px,auto) auto;gap:6px;align-items:center;font-size:clamp(24px,3vw,34px)}
.expert-factor-row .lhs{text-align:right}.expert-factor-row .eq{text-align:center;font-family:var(--sans);font-size:.72em}
.expert-factor-tail{display:flex;align-items:center;gap:4px;font:800 13px var(--sans);color:#657572}

.math-field{
  min-width:92px;max-width:270px;min-height:38px;
  display:inline-flex;align-items:center;gap:1px;padding:2px 4px 4px;
  border:0;border-bottom:2px solid rgba(79,145,170,.28);
  background:transparent;border-radius:0;
  font:760 26px/1 var(--sans);color:#34494d;cursor:text
}
.math-field.active{border-bottom-color:rgba(79,145,170,.88);background:linear-gradient(transparent 73%,rgba(207,238,247,.40) 73% 100%)}
.math-field.bad{border-bottom-color:#b85e57;background:linear-gradient(transparent 73%,rgba(255,218,218,.48) 73% 100%)}
.math-empty{font-size:11px;font-weight:700;color:#9aa5a2}
.math-caret{display:inline-block;width:2px;height:1em;background:#4e6468;margin-left:2px;animation:expertBlink 1s steps(1) infinite}
@keyframes expertBlink{50%{opacity:0}}

.math-frac{
  display:inline-grid;grid-template-rows:auto 2px auto;align-items:center;justify-items:stretch;
  min-width:1.25em;margin:0 .08em;vertical-align:middle;font-size:.78em;line-height:1
}
.math-frac-line{height:1.5px;background:currentColor;width:100%}
.math-frac-part{min-width:1.25em;min-height:.88em;padding:1px 3px;border-radius:3px;display:grid;place-items:center}
.math-frac-part.active{background:rgba(207,238,247,.95);box-shadow:inset 0 -2px 0 rgba(79,145,170,.62)}
.math-frac-empty{display:inline-block;width:.65em;height:.62em;border:1.5px dashed rgba(76,94,96,.40);border-radius:2px}

.expert-keypad{
  display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:9px;
  border:1px solid rgba(63,76,79,.12);border-radius:14px;background:rgba(255,255,255,.34);
  box-shadow:0 8px 22px rgba(64,69,61,.05)
}
.expert-key{min-height:40px;border:1px solid rgba(63,76,79,.13);border-radius:10px;background:rgba(255,255,255,.68);font:800 18px var(--sans);color:#435558;display:grid;place-items:center}
.expert-key.var{font-family:Georgia,serif;font-style:italic;font-size:22px}
.expert-key.op{font-size:21px}
.expert-key.small{font-size:12px}
.expert-check{grid-column:1/-1;min-height:39px;border:1px solid rgba(95,143,105,.24);border-radius:10px;background:rgba(223,241,200,.62);font:850 10px var(--sans);color:#46594e}
.expert-frac-icon{display:grid;grid-template-rows:8px 1.5px 8px;width:18px;align-items:center;justify-items:center}
.expert-frac-icon .box{width:9px;height:6px;border:1.4px solid currentColor;border-radius:1px}.expert-frac-icon .line{width:18px;height:1.5px;background:currentColor}
.expert-feedback{min-height:26px;text-align:center;font-size:10px;font-weight:760;line-height:1.25;color:#71807d}
.expert-feedback.bad{color:#9a5752}
.expert-choice{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
.expert-choice button{border:1px solid rgba(63,76,79,.14);border-radius:999px;background:rgba(255,255,255,.48);padding:7px 11px;font-size:11px;font-weight:850}
.expert-final{font-family:var(--hand);font-size:clamp(28px,4vw,48px);font-weight:850;background:linear-gradient(transparent 50%,rgba(216,243,165,.68) 50% 100%);padding:0 .2em}
.expert-row-source{font-family:var(--hand);font-size:clamp(22px,2.8vw,34px)}


main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 228px}
.workzone{min-width:0;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;padding:10px 12px 10px}
.instruction-panel{display:grid;gap:2px;min-height:42px;align-content:center}
.stage-kicker{font-size:10px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;color:#80908c}
.instruction{display:flex;align-items:center;gap:8px;min-height:27px}
.instruction .tag{font-size:9px;font-weight:900;letter-spacing:.12em;color:#667774;background:linear-gradient(transparent 35%,var(--phase-soft) 35% 95%,transparent 95%);padding:0 2px}
.instruction span:last-child{font-size:14px;font-weight:780;line-height:1.18}

#systemWrap{min-width:0;min-height:0;display:grid;place-items:center;overflow:hidden}
#auxArea{min-height:0;display:flex;justify-content:center;align-items:center}
#auxArea:empty{display:none}

.steps{min-width:0;overflow:auto;border-left:1px solid rgba(70,80,79,.10);padding:12px 11px;background:rgba(255,255,255,.16)}
.steps h2{margin:0 0 10px;font-size:12px;letter-spacing:.13em;color:#6d7b79}
.step{position:relative;min-height:66px;padding:8px 0 9px;border-bottom:1px solid rgba(70,80,79,.08)}
.step:last-child{border-bottom:0}
.step-head{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:center}
.step-num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(66,80,79,.16);font-size:10px;font-weight:900;color:#76817f;background:rgba(255,255,255,.4)}
.step strong{font-size:12px}
.step.active .step-num{background:var(--phase-soft);color:#43514e}
.step.done .step-num{background:#e9f0df}
.snapshot{margin:6px 0 0 36px;font-family:var(--hand);font-size:12px;color:#6d7776;line-height:1.15}
.mini-system{display:grid;grid-template-columns:18px 1fr;align-items:center}
.mini-brace{font-family:Georgia,serif;font-size:38px;line-height:.72}
.mini-eqs{display:grid;gap:2px}
.mini-row{display:grid;grid-template-columns:1fr 12px 1fr;gap:2px;align-items:center;font-size:10px}
.mini-row .lhs{text-align:right}.mini-row .eq{text-align:center}.mini-row .rhs{text-align:left}

.system{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;max-width:min(920px,95%);font-family:var(--hand)}
.brace{font-family:Georgia,"Times New Roman",serif;font-size:clamp(112px,15vw,184px);line-height:.66;transform:scaleY(1.08);color:#46565a;user-select:none}
.eqs{display:grid;gap:10px;min-width:0}
.eq-row{position:relative;display:grid;grid-template-columns:minmax(160px,auto) 34px minmax(180px,auto);align-items:center;min-height:58px;padding:4px 12px;border-radius:12px;font-size:clamp(31px,4vw,50px);line-height:1;white-space:nowrap}
.eq-row .lhs{text-align:right}.eq-row .eq{text-align:center;font-family:var(--sans);font-size:.7em;color:#6e7978}.eq-row .rhs{text-align:left}
.eq-row.focus{background:linear-gradient(transparent 10%,rgba(216,243,165,.68) 10% 90%,transparent 90%)}
.eq-row.locked{opacity:.45}

.drag-source{
  display:inline-block;position:relative;z-index:2;border-radius:7px;padding:1px 5px;
  touch-action:none;cursor:grab;
  background:linear-gradient(transparent 46%,rgba(207,238,247,.92) 46% 100%);
  box-shadow:inset 0 -2px 0 rgba(79,145,170,.58);
}
.drag-source:hover{background:linear-gradient(transparent 38%,rgba(207,238,247,1) 38% 100%)}
.drag-source:active{cursor:grabbing}
.drag-source.selected,.factor-chip.selected,.choice-source.selected{box-shadow:0 0 0 3px rgba(79,145,170,.28),inset 0 -2px 0 rgba(79,145,170,.76);background:linear-gradient(transparent 30%,rgba(207,238,247,1) 30% 100%)}
.drop-target{
  display:inline-block;min-width:34px;border-radius:7px;padding:1px 5px;
  outline:2px dashed rgba(95,143,105,.38);outline-offset:2px;
  background:rgba(223,241,200,.18)
}
.soft-target{outline-color:rgba(95,143,105,.42)}
.drop-target.hot,.drop-target.ready{background:rgba(216,243,165,.82);outline-color:#6f9767}
.pair-slot.ready,.choice-drop.ready,.factor-slot.ready{background:rgba(216,243,165,.72);outline:2px dashed #6f9767;outline-offset:2px}
.eq-row.locked .drag-source,.eq-row.locked .drop-target{
  background:transparent;box-shadow:none;outline-color:transparent;cursor:default
}
.ghost{position:fixed;z-index:99;pointer-events:none;transform:translate(-50%,-50%);font-family:var(--hand);font-size:34px;background:#fffdf7;border:1px solid rgba(70,80,79,.12);border-radius:10px;padding:5px 9px;box-shadow:var(--shadow)}
body.is-dragging{user-select:none}

.frac{display:inline-grid;grid-template-rows:auto 2px auto;vertical-align:middle;align-items:center;justify-items:center;min-width:1.15em;font-size:.82em;line-height:.9}
.frac .num,.frac .den{padding:0 .06em}.frac .bar{width:100%;height:1.5px;background:currentColor}
.mul-dot{font-family:var(--sans);font-size:.62em;vertical-align:.08em;padding:0 .08em}

.factor-layout{display:grid;gap:12px;justify-items:center}
.factor-system{display:grid;grid-template-columns:auto 1fr;align-items:center;font-family:var(--hand)}
.factor-eqs{display:grid;gap:10px}
.factor-row{display:grid;grid-template-columns:minmax(140px,auto) 28px minmax(90px,auto) auto;gap:8px;align-items:center;font-size:clamp(29px,3.6vw,46px)}
.factor-row .lhs{text-align:right}.factor-row .eq{text-align:center;font-family:var(--sans);font-size:.7em}
.factor-box{display:flex;align-items:center;gap:5px;font:800 14px var(--sans);color:#667571}
.factor-slot{width:48px;height:38px;display:grid;place-items:center;font-family:var(--hand);font-size:22px}
.factor-rail{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
.factor-feedback{max-width:680px;min-height:18px;margin-top:5px;text-align:center;font-size:12px;font-weight:780;color:#7d5a31}
.factor-chip{min-width:42px;height:36px;display:grid;place-items:center;border:1px solid rgba(70,80,79,.14);border-radius:9px;background:rgba(255,255,255,.42);font-family:var(--hand);font-size:20px;touch-action:none;cursor:grab}

.addition-board{display:grid;gap:4px;font-family:var(--hand);font-size:clamp(25px,3.3vw,42px);min-width:min(720px,90%)}
.addition-row{display:grid;grid-template-columns:1fr 1fr 38px 1fr;gap:7px;align-items:center;text-align:center}
.addition-line{height:2px;background:#657174;opacity:.65}
.addition-row.result{font-weight:800}.add-result-zero{opacity:.45}
.pending{color:#9aa4a2}
.comb-add-stage{
  width:min(900px,96%);height:100%;min-height:0;
  display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px;align-items:center
}
.comb-original-ref{
  justify-self:center;display:grid;grid-template-columns:32px auto;align-items:center;
  font-family:var(--hand);opacity:.78
}
.comb-original-ref .ref-brace{font-family:Georgia,serif;font-size:70px;line-height:.68;transform:scaleY(1.08)}
.comb-original-ref .ref-eqs{display:grid;gap:2px}
.comb-original-ref .ref-row{
  display:grid;grid-template-columns:minmax(86px,auto) 20px minmax(52px,auto);
  align-items:center;font-size:20px;white-space:nowrap
}
.comb-original-ref .lhs{text-align:right}.comb-original-ref .eq{text-align:center;font-family:var(--sans);font-size:.72em}.comb-original-ref .rhs{text-align:left}

.original-choice{
  display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
  gap:18px;align-items:center;width:min(980px,97%);min-height:0
}
.choice-system{
  display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;
  font-family:var(--hand);min-width:0
}
.choice-brace{
  font-family:Georgia,serif;font-size:112px;line-height:.68;transform:scaleY(1.08);
  color:#46565a;user-select:none
}
.choice-eqs{display:grid;gap:8px;min-width:0}
.choice-row{
  display:grid;grid-template-columns:minmax(90px,auto) 24px minmax(60px,auto);
  align-items:center;min-height:43px;font-size:clamp(24px,3vw,36px);white-space:nowrap
}
.choice-row .lhs{text-align:right}.choice-row .eq{text-align:center;font-family:var(--sans);font-size:.7em}.choice-row .rhs{text-align:left}
.choice-source{
  padding:2px 7px;border-radius:9px;cursor:grab;touch-action:none;
  background:linear-gradient(transparent 48%,rgba(207,238,247,.88) 48% 100%);
  box-shadow:inset 0 -2px 0 rgba(79,145,170,.54)
}
.choice-drop{
  min-width:220px;min-height:48px;display:grid;place-items:center;
  border:2px dashed rgba(95,143,105,.38);border-radius:10px;
  background:rgba(223,241,200,.16);font:800 11px var(--sans);color:#7c8986
}
.choice-arrow{font-size:24px;color:#87918f}
.choice-fixed{background:linear-gradient(transparent 48%,rgba(216,243,165,.52) 48% 100%);border-radius:8px;padding:1px 5px}

.pair-line{display:flex;align-items:center;justify-content:center;gap:5px;font-family:var(--hand);font-size:clamp(27px,3.5vw,42px)}
.pair-slot{width:54px;height:43px;display:grid;place-items:center;border:1px dashed rgba(72,89,85,.28);border-radius:9px;font-family:var(--hand);font-size:24px}
.pair-slot.filled{background:rgba(216,243,165,.45)}
.special-choice{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap}
.special-choice button,.continue-btn{border:1px solid rgba(63,76,79,.18);border-radius:999px;background:rgba(255,255,255,.45);padding:8px 12px;font-size:12px;font-weight:850}
.special-result{display:inline-block;font-weight:900;font-size:clamp(20px,3vw,34px);background:linear-gradient(transparent 42%,var(--phase-soft) 42% 100%);padding:0 .25em}

.graph-stage{width:100%;height:100%;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) 56px;gap:6px}
.graph-ref{justify-self:center;display:grid;grid-template-columns:44px auto;align-items:center;font-family:var(--hand);max-width:700px;width:min(700px,96%);min-height:78px}
.graph-ref-brace{font-family:Georgia,serif;font-size:94px;line-height:.68;transform:scaleY(1.1);color:#445459}
.graph-ref-eqs{display:grid;gap:3px}
.graph-ref-row{position:relative;display:grid;grid-template-columns:minmax(58px,auto) 28px minmax(145px,1fr);align-items:center;min-height:36px;padding:2px 10px;border-radius:10px;font-size:clamp(25px,2.3vw,32px);line-height:1;white-space:nowrap}
.graph-ref-row .lhs{text-align:right}.graph-ref-row .eq{text-align:center;font-family:var(--sans);font-size:.74em;color:#687575}.graph-ref-row .rhs{text-align:left}
.graph-ref-row.active-0{background:linear-gradient(transparent 13%,var(--blue-soft) 13% 89%,transparent 89%);box-shadow:inset 4px 0 0 var(--blue);color:#245f75;font-weight:820}
.graph-ref-row.active-1{background:linear-gradient(transparent 13%,var(--green-soft) 13% 89%,transparent 89%);box-shadow:inset 4px 0 0 var(--green);color:#3e6f38;font-weight:820}
.graph-plot-area{min-width:0;min-height:0;width:100%;height:100%;padding:2px;display:grid;place-items:center;overflow:hidden;--graph-size:1px}
.graph-board{display:block;width:var(--graph-size);height:var(--graph-size);max-width:none;max-height:none;touch-action:manipulation}
.graph-grid{stroke:#e3e1da;stroke-width:1}.graph-axis{stroke:#526367;stroke-width:2}.graph-label{font:11px var(--sans);fill:#7c8584}.graph-axis-label{font:700 14px var(--sans);fill:#4d5e62}
.graph-line1{stroke:var(--blue);stroke-width:4;stroke-linecap:round}.graph-line2{stroke:var(--green);stroke-width:4;stroke-linecap:round}
.graph-point1{fill:var(--blue);stroke:#fffdf7;stroke-width:3}.graph-point2{fill:var(--green);stroke:#fffdf7;stroke-width:3}
.graph-point-label1,.graph-point-label2{font:700 12px var(--sans);paint-order:stroke;stroke:#fffdf7;stroke-width:4px;stroke-linejoin:round}.graph-point-label1{fill:var(--blue)}.graph-point-label2{fill:var(--green)}
.graph-intersection{fill:#fffdf7;stroke:#9b7529;stroke-width:3}.graph-intersection.found{fill:#f5dfa1}.graph-intersection-core{fill:#9b7529;pointer-events:none}.graph-hit-plane{fill:transparent;cursor:crosshair;touch-action:manipulation}
.graph-stage-footer{min-height:0;display:flex;align-items:center;justify-content:center}.graph-stage-footer.spacer{visibility:hidden;pointer-events:none}
.graph-solution-strip{width:100%;min-height:50px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:7px 11px;padding:2px 7px 4px;font-weight:800;font-size:15px}
.graph-solution-strip .coord-src{font-family:var(--hand);font-size:26px}.therefore{font-size:12px;font-weight:900;background:linear-gradient(transparent 40%,var(--phase-soft) 40% 100%);padding:0 .3em}

.toast{position:fixed;max-width:min(560px,90vw);text-align:center;left:50%;bottom:12px;transform:translateX(-50%);z-index:100;background:#fffdf7;border:1px solid rgba(70,80,79,.14);border-radius:9px;padding:7px 10px;font-size:12px;font-weight:800;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.16s}.toast.show{opacity:1}.toast.bad{color:#9b4e48}

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const app=$('#app'),systemWrap=$('#systemWrap'),auxArea=$('#auxArea'),stageKicker=$('#stageKicker'),instructionText=$('#instructionText'),stepsList=$('#stepsList'),toast=$('#toast'),exerciseSelect=$('#exerciseSelect'),undoBtn=$('#undoBtn');

/* ---------- exact arithmetic + exercise analysis ---------- */
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1}
class Q{
  constructor(n,d=1){
    if(!Number.isFinite(n)||!Number.isFinite(d)||!Number.isInteger(n)||!Number.isInteger(d))throw new Error('Ongeldig rationaal getal');
    if(d===0)throw new Error('Delen door nul');
    if(d<0){n=-n;d=-d}
    const g=gcd(n,d);this.n=n/g;this.d=d/g
  }
  add(o){o=Q.from(o);return new Q(this.n*o.d+o.n*this.d,this.d*o.d)}
  sub(o){o=Q.from(o);return new Q(this.n*o.d-o.n*this.d,this.d*o.d)}
  mul(o){o=Q.from(o);return new Q(this.n*o.n,this.d*o.d)}
  div(o){o=Q.from(o);if(o.zero())throw new Error('Delen door nul');return new Q(this.n*o.d,this.d*o.n)}

function analyzeSystem(eq){

}

/* ----- expert: SUBSTITUTION ----- */
function eSubExpected(){
  if(state.isoRow===null||!state.isoRhs)return null;
  const target=equations()[1-state.isoRow],r=state.isoRhs,v=state.isoVar;
  if(v==='x'){
    return {x:q(0),y:target.x.mul(r.y).add(target.y),c:target.x.mul(r.c).sub(target.c)}
  }
  return {x:target.y.mul(r.x).add(target.x),y:q(0),c:target.y.mul(r.c).sub(target.c)}
}
function eFindIsolatedRoute(){
  const rhs=eParse('isoRhs');if(!rhs)return null;
  const v=state.isoVar,other=v==='x'?'y':'x';
  if(!rhs[v].zero())return null;
  const left={x:v==='x'?q(1):q(0),y:v==='y'?q(1):q(0),c:q(0)};
  const vec={x:left.x.sub(rhs.x),y:left.y.sub(rhs.y),c:left.c.sub(rhs.c)};
  for(let row=0;row<2;row++)if(eVecEquivalent(vec,eVecFromEquation(equations()[row])))return {row,rhs,vec,other};
  return null
}
function eSubTermHTML(coef,varName,contentHTML=null,first=false,target=false){
  coef=q(coef);
  if(coef.zero())return '';
  const neg=coef.n<0,abs=coef.abs();
  let body='';
  if(contentHTML!==null){
    const core=target?`<span class="expert-sub-slot" id="expertSubTarget">${varName}</span>`:`<span class="expert-sub-inserted">(${contentHTML})</span>`;
    body=abs.one()?core:`${qHTML(abs)}${core}`
  }else{
    body=termBody(abs,varName)
  }
  if(first)return `${neg?'−':''}${body}`;
  return `${neg?'−':'+'} ${body}`
}
function eSubVisualRow(placed){
  const target=equations()[1-state.isoRow],v=state.isoVar,expr=eStaticHTML('isoRhs');
  const terms=[];
  for(const name of ['x','y']){
    const coef=target[name];
    if(coef.zero())continue;
    if(name===v)terms.push(eSubTermHTML(coef,name,placed?expr:null,terms.length===0,!placed));
    else terms.push(eSubTermHTML(coef,name,null,terms.length===0,false))
  }
  return {lhs:terms.join(' '),rhs:qHTML(target.c)}
}
function renderExpertSubstitution(){
  if(state.phase===1){
    setInstruction('1 · expert','Maak x of y vrij in één vergelijking.');
    if(!state.activeEditor)state.activeEditor='isoRhs';
    const task=`<div class="expert-task-title">Kies de onbekende links en schrijf het rechterlid zelf.</div>
      <div class="expert-choice"><button data-isovar="x" ${state.isoVar==='x'?'class="active"':''}>x vrijmaken</button><button data-isovar="y" ${state.isoVar==='y'?'class="active"':''}>y vrijmaken</button></div>
      <div class="expert-equation"><span class="left">${state.isoVar}</span><span class="eq">=</span><span class="right">${eFieldHTML('isoRhs','uitdrukking')}</span></div>`;
    systemWrap.innerHTML=eWorkspace(task,'controleer vrije vorm');eWireEditors();
    $$('[data-isovar]').forEach(b=>b.addEventListener('click',()=>{state.isoVar=b.dataset.isovar;eClearFeedback();render()}));
    $('#expertCheck').addEventListener('click',()=>{
      const route=eFindIsolatedRoute();
      if(!route){transition(()=>eSetError('Deze vrije vorm volgt niet uit één van de twee oorspronkelijke vergelijkingen.','isoRhs'));return}
      transition(()=>{state.isoRow=route.row;state.isoRhs=route.rhs;state.subVector=eSubExpected();state.subPlaced=false;eClearFeedback();eSnapshot(1,`${state.isoVar} = ${ePretty('isoRhs')}`);state.phase=2;state.activeEditor=null})
    });return
  }

  if(state.phase===2){
    const v=state.isoVar,other=v==='x'?'y':'x';

    if(!state.subPlaced){
      setInstruction('2 · expert','Substitueer je gevonden uitdrukking in de andere vergelijking.');
      const row=eSubVisualRow(false);
      const task=`<div class="expert-substitution-stage">
        <div class="expert-task-title">Vervang ${v} in de andere vergelijking door je gevonden uitdrukking.</div>
        <div class="expert-sub-source-row"><span>${v} =</span><span class="expert-sub-source" id="expertSubSource">${eStaticHTML('isoRhs')}</span></div>
        <div class="expert-sub-arrow">↓</div>
        <div class="expert-sub-equation"><span class="lhs">${row.lhs}</span><span class="eq">=</span><span class="rhs">${row.rhs}</span></div>
      </div>`;
      systemWrap.innerHTML=eWorkspace(task,'',false);
      moveControl($('#expertSubSource'),$('#expertSubSource').innerHTML,['#expertSubTarget'],()=>transition(()=>{
        state.subPlaced=true;
        eClearFeedback();
        state.activeEditor='subL'
      }));
      return
    }

    setInstruction('2 · expert','Werk de haakjes uit en vereenvoudig.');
    const row=eSubVisualRow(true);
    const task=`<div class="expert-substitution-stage">
      <div class="expert-task-title">Je substitutie staat nu klaar. Werk de haakjes uit en vereenvoudig tot één vergelijking met ${other}.</div>
      <div class="expert-sub-equation"><span class="lhs">${row.lhs}</span><span class="eq">=</span><span class="rhs">${row.rhs}</span></div>
      <div class="expert-sub-next">
        <div class="expert-equation"><span class="left">${eFieldHTML('subL','linkerlid')}</span><span class="eq">=</span><span class="right">${eFieldHTML('subR','rechterlid')}</span></div>
      </div>
    </div>`;
    systemWrap.innerHTML=eWorkspace(task,'controleer vereenvoudiging');eWireEditors();
    $('#expertCheck').addEventListener('click',()=>{
      const user=eVecFromEditors('subL','subR'),expected=state.subVector;
      if(!user||!eVecEquivalent(user,expected)){transition(()=>eSetError('Deze vergelijking is nog niet equivalent met de substitutiestap.',!eParse('subL')?'subL':'subR'));return}
      if(expected.x.zero()&&expected.y.zero()){
        transition(()=>{eClearFeedback();eSnapshot(2,`${ePretty('subL')} = ${ePretty('subR')}`);state.phase=3;state.activeEditor=null});return
      }
      const fv=expected.x.zero()?'y':'x',coef=expected[fv],value=expected.c.neg().div(coef);

    });
    return
  }

  if(state.phase===3){
    const expected=state.subVector;
    if(expected.x.zero()&&expected.y.zero()){
      setInstruction('3 · expert','Trek de conclusie uit de vergelijking.');
      const identity=expected.c.zero();
      const task=`<div class="expert-task-title">${identity?'Je kreeg een identiteit.':'Je kreeg een tegenspraak.'}</div>
        <div class="expert-final">${identity?'0 = 0':'0 = '+qHTML(expected.c.neg())}</div>
        <div class="expert-choice"><button data-class="coincident">oneindig veel oplossingen</button><button data-class="parallel">geen oplossing</button></div>`;
      systemWrap.innerHTML=eWorkspace(task,'');eWireEditors();$('#expertCheck').style.display='none';
      $$('[data-class]').forEach(b=>b.addEventListener('click',()=>{
        const want=identity?'coincident':'parallel';
        if(b.dataset.class!==want){showToast('Kijk nog eens naar de gelijkheid.',true);return}
        transition(()=>{eSnapshot(3,identity?'oneindig veel oplossingen':'geen oplossing');state.phase=4;state.solved=true;axiomaStelselsSolved()})

    systemWrap.innerHTML=eWorkspace(task,'controleer waarde');eWireEditors();
    $('#expertCheck').addEventListener('click',()=>{
      const val=eParseConstant('solveVal');
      if(!val||!val.eq(state.foundValue)){transition(()=>eSetError('Die waarde klopt nog niet.','solveVal'));return}
      transition(()=>{eClearFeedback();eSnapshot(3,`${state.foundVar} = ${qPlain(val)}`);state.phase=4;state.activeEditor='otherVal'})
    });return
  }

  if(state.phase===4){
    if(info().kind!=='point'){
      setInstruction('4 · oplossing','');
      systemWrap.innerHTML=`<div class="expert-final">${info().solutionText}</div>`;state.solved=true;axiomaStelselsSolved();return
    }
    setInstruction('4 · expert','Bereken de andere onbekende.');
    const other=state.foundVar==='x'?'y':'x',expected=sol()[other];
    const task=`<div class="expert-task-title">Gebruik je gevonden waarde in één oorspronkelijke vergelijking.</div>
      <div class="expert-equation"><span class="left">${other}</span><span class="eq">=</span><span class="right">${eFieldHTML('otherVal','waarde')}</span></div>`;
    systemWrap.innerHTML=eWorkspace(task,'controleer waarde');eWireEditors();
    $('#expertCheck').addEventListener('click',()=>{

      transition(()=>{eClearFeedback();eSnapshot(4,`${other} = ${qPlain(val)}`);state.phase=5;state.activeEditor=null})
    });return
  }

  setInstruction('5 · oplossing','');
  const s=sol();systemWrap.innerHTML=`<div class="expert-final">(x,y) = (${qHTML(s.x)}, ${qHTML(s.y)})</div>`;

}

function eScaledVector(row,f){const v=eVecFromEquation(equations()[row]);return {x:v.x.mul(f),y:v.y.mul(f),c:v.c.mul(f)}}
function eSumVec(a,b){return {x:a.x.add(b.x),y:a.y.add(b.y),c:a.c.add(b.c)}}

    });return
  }

  if(state.phase===4){

    });return

  setInstruction('6 · oplossing','');
  const s=sol();systemWrap.innerHTML=`<div class="expert-final">(x,y) = (${qHTML(s.x)}, ${qHTML(s.y)})</div>`;
  state.snapshots[6]={type:'text',text:`(x,y)=(${qPlain(s.x)},${qPlain(s.y)})`};state.solved=true;axiomaStelselsSolved();renderSteps()

/* ---------- GRAPHIC ---------- */
function graphForm(e){if(e.y.zero()){if(e.x.zero())throw new Error('Geen geldige rechte');return {vertical:true,x:e.c.div(e.x)}}return {vertical:false,m:e.x.neg().div(e.y),b:e.c.div(e.y)}}
function graphRows(){return equations().map(e=>{const f=graphForm(e);return f.vertical?{lhs:'x',rhs:qHTML(f.x)}:{lhs:'y',rhs:affineSlopeFirst(f.m,'x',f.b)}})}
function graphStage(board,activeLine=null,footer=''){const rows=graphRows();return `<div class="graph-stage"><div class="graph-ref"><div class="graph-ref-brace">{</div><div class="graph-ref-eqs">${rows.map((r,i)=>`<div class="graph-ref-row ${activeLine===i?'active-'+i:''}"><span class="lhs">${r.lhs}</span><span class="eq">=</span><span class="rhs">${r.rhs}</span></div>`).join('')}</div></div><div class="graph-plot-area">${board}</div><div class="graph-stage-footer ${footer?'':'spacer'}">${footer}</div></div>`}
function fitGraph(){if(graphObserver){graphObserver.disconnect();graphObserver=null}const area=$('.graph-plot-area');if(!area)return;const apply=()=>{const r=area.getBoundingClientRect(),size=Math.floor(Math.min(r.width-4,r.height-4));if(size>0)area.style.setProperty('--graph-size',size+'px')};requestAnimationFrame(apply);if('ResizeObserver'in window){graphObserver=new ResizeObserver(()=>requestAnimationFrame(apply));graphObserver.observe(area)}}
function graphY(line,x){const f=graphForm(equations()[line]);return f.vertical?null:f.m.mul(q(x)).add(f.b)}
function validGraphPoint(line,x,y){const f=graphForm(equations()[line]);return f.vertical?f.x.eq(q(x)):graphY(line,x).eq(q(y))}
function graphBounds(){const vals=[q(0)];for(const e of equations()){const f=graphForm(e);if(f.vertical)vals.push(f.x.abs());else{vals.push(f.b.abs());if(!f.m.zero())vals.push(f.b.neg().div(f.m).abs())}}if(sol())vals.push(sol().x.abs(),sol().y.abs());const max=Math.max(...vals.map(v=>Math.abs(v.num())),3),M=Math.min(12,Math.max(4,Math.ceil(max)+2));return {xmin:-M,xmax:M,ymin:-M,ymax:M}}
function graphBoard(opts={}){
  const W=600,H=600,left=52,right=28,top=28,bottom=52,{xmin,xmax,ymin,ymax}=graphBounds();
  const X=x=>left+(x-xmin)/(xmax-xmin)*(W-left-right),Y=y=>H-bottom-(y-ymin)/(ymax-ymin)*(H-top-bottom);
  let grid='',lines='',marks='';
  for(let x=xmin;x<=xmax;x++){grid+=`<line class="graph-grid" x1="${X(x)}" y1="${Y(ymin)}" x2="${X(x)}" y2="${Y(ymax)}"></line>`;if(x!==0)grid+=`<text class="graph-label" x="${X(x)}" y="${Y(0)+20}" text-anchor="middle">${x}</text>`}
  for(let y=ymin;y<=ymax;y++){grid+=`<line class="graph-grid" x1="${X(xmin)}" y1="${Y(y)}" x2="${X(xmax)}" y2="${Y(y)}"></line>`;if(y!==0)grid+=`<text class="graph-label" x="${X(0)-9}" y="${Y(y)+4}" text-anchor="end">${y}</text>`}
  grid+=`<line class="graph-axis" x1="${X(xmin)}" y1="${Y(0)}" x2="${X(xmax)}" y2="${Y(0)}"></line><line class="graph-axis" x1="${X(0)}" y1="${Y(ymin)}" x2="${X(0)}" y2="${Y(ymax)}"></line><text class="graph-axis-label" x="${W-14}" y="${Y(0)-9}">x</text><text class="graph-axis-label" x="${X(0)+8}" y="16">y</text>`;
  for(let i=0;i<2;i++)if(opts['showLine'+(i+1)]){const f=graphForm(equations()[i]),dash=info().kind==='coincident'&&i===1?'stroke-dasharray="10 8"':'';if(f.vertical)lines+=`<line class="graph-line${i+1}" x1="${X(f.x.num())}" y1="${Y(ymin)}" x2="${X(f.x.num())}" y2="${Y(ymax)}" ${dash}></line>`;else lines+=`<line class="graph-line${i+1}" x1="${X(xmin)}" y1="${Y(graphY(i,xmin).num())}" x2="${X(xmax)}" y2="${Y(graphY(i,xmax).num())}" ${dash}></line>`}
  (opts.points1||[]).forEach(p=>marks+=`<circle class="graph-point1" cx="${X(p.x)}" cy="${Y(p.y)}" r="7"></circle><text class="graph-point-label1" x="${Math.min(W-65,X(p.x)+9)}" y="${Math.max(18,Y(p.y)-9)}">(${p.x},${p.y})</text>`);
  (opts.points2||[]).forEach(p=>marks+=`<circle class="graph-point2" cx="${X(p.x)}" cy="${Y(p.y)}" r="7"></circle><text class="graph-point-label2" x="${Math.min(W-65,X(p.x)+9)}" y="${Math.max(18,Y(p.y)-9)}">(${p.x},${p.y})</text>`);
  if(opts.intersection&&sol()){const sx=sol().x.num(),sy=sol().y.num();marks+=`<circle id="intersection" class="graph-intersection ${opts.found?'found':''}" cx="${X(sx)}" cy="${Y(sy)}" r="12"></circle><circle class="graph-intersection-core" cx="${X(sx)}" cy="${Y(sy)}" r="3"></circle>`}
  const hit=opts.selectable?`<rect id="graphHitPlane" class="graph-hit-plane" x="${left}" y="${top}" width="${W-left-right}" height="${H-top-bottom}"></rect>`:'';
  return `<svg class="graph-board" viewBox="0 0 ${W} ${H}" data-left="${left}" data-top="${top}" data-right="${right}" data-bottom="${bottom}" data-xmin="${xmin}" data-xmax="${xmax}" data-ymin="${ymin}" data-ymax="${ymax}" aria-label="assenstelsel"><defs><clipPath id="plotClip"><rect x="${left}" y="${top}" width="${W-left-right}" height="${H-top-bottom}"></rect></clipPath></defs>${grid}<g clip-path="url(#plotClip)">${lines}</g>${marks}${hit}</svg>`
}
function graphPointFromEvent(e){const svg=$('.graph-board');if(!svg)return null;const r=svg.getBoundingClientRect(),W=600,H=600,left=+svg.dataset.left,top=+svg.dataset.top,right=+svg.dataset.right,bottom=+svg.dataset.bottom,xmin=+svg.dataset.xmin,xmax=+svg.dataset.xmax,ymin=+svg.dataset.ymin,ymax=+svg.dataset.ymax,sx=(e.clientX-r.left)*W/r.width,sy=(e.clientY-r.top)*H/r.height,x=Math.max(xmin,Math.min(xmax,Math.round(xmin+(sx-left)/(W-left-right)*(xmax-xmin)))),y=Math.max(ymin,Math.min(ymax,Math.round(ymax-(sy-top)/(H-top-bottom)*(ymax-ymin))));return {x,y}}
function advanceGraphFree(){state.freeEq++;state.freeStage=0;if(state.freeEq>=2){state.snapshots[1]={type:'rows',rows:graphRows()};state.phase=2}}
function renderGraphic(){if(state.phase===1)return renderGraphFree();if(state.phase===2)return renderGraphPoints();if(state.phase===3)return renderGraphIntersection();renderGraphSolution()}

    if(e.x.one()){rows[i]=finished[i];systemWrap.innerHTML=systemHTML(rows,{focus:i,locked:1-i});auxArea.innerHTML='<button class="continue-btn" id="continueGraph">VERDER</button>';$('#continueGraph').addEventListener('click',()=>transition(advanceGraphFree));return}
    rows[i]={lhs:`<span class="drag-source" id="gsrc">${qHTML(e.x)}</span>x`,rhs:`<span class="drop-target soft-target" id="gtgt">${qHTML(e.c)}</span>`};systemWrap.innerHTML=systemHTML(rows,{focus:i,locked:1-i});moveControl($('#gsrc'),qHTML(e.x),['#gtgt'],()=>transition(advanceGraphFree));return
  }
  const stage=state.freeStage;setInstruction('1 · maak vrij',stage===0?`Maak vergelijking ${i+1} vrij naar y.`:stage===1?`Deel door ${qPlain(e.y)}.`:'Zet in y = ax + b-vorm.');
  if(stage===0){rows[i]={lhs:`<span class="drag-source" id="gsrc">${signedTerm(e.x,'x',true)}</span> ${signedTerm(e.y,'y',false)}`,rhs:`<span class="drop-target soft-target" id="gtgt">${qHTML(e.c)}</span>`};systemWrap.innerHTML=systemHTML(rows,{focus:i,locked:1-i});moveControl($('#gsrc'),$('#gsrc').innerHTML,['#gtgt'],()=>transition(()=>{state.freeStage=e.y.one()?2:1}));return}

  rows[i]={lhs:'y',rhs:`<span class="drop-target soft-target" id="gtgt">${qHTML(f.b)}</span> <span class="drag-source" id="gsrc">${signedTerm(f.m,'x',false)}</span>`};systemWrap.innerHTML=systemHTML(rows,{focus:i,locked:1-i});moveControl($('#gsrc'),$('#gsrc').innerHTML,['#gtgt'],()=>transition(advanceGraphFree))

function renderGraphPoints(){
  const line=state.activeLine,gr=graphRows();setInstruction('2 · kies punten',`Kies twee roosterpunten op ${mathText(gr[line].lhs)} = ${mathText(gr[line].rhs)}.`);

function routeFrom(row,iso){const S=equations()[row],T=equations()[1-row],other=iso==='x'?'y':'x',cv=S[iso];if(cv.zero())throw new Error(`${iso} komt niet voor in deze vergelijking`);const co=S[other],beta=S.c.div(cv),alpha=co.neg().div(cv),tv=T[iso],tw=T[other],prodConst=tv.mul(beta),prodVar=tv.mul(alpha),k=prodVar.add(tw),rhs=T.c.sub(prodConst);return {row,target:1-row,iso,other,cv,co,beta,alpha,tv,tw,prodConst,prodVar,k,rhs}}
function isolatedRows(r){const rows=originalRows();rows[r.row]={lhs:r.iso,rhs:affineConstFirst(r.beta,r.alpha,r.other)};return rows}
function finishSubSolve(r){if(r.k.zero()){state.snapshots[2]={type:'text',text:`0 = ${qPlain(r.rhs)}`};state.phase=3;state.backStage=0}else if(r.k.one()){state.snapshots[2]={type:'text',text:`${r.other} = ${qPlain(r.rhs)}`};state.phase=3;state.backStage=0}else state.subStage=4}
function renderSubstitution(){if(info().kind!=='point'&&state.phase>=3)return renderSubSpecialConclusion();if(state.phase===1)return renderSubIsolate();if(state.phase===2)return renderSubstitute();if(state.phase===3)return renderSubBack();renderSubPair()}
function renderSubIsolate(){
  setInstruction('1 · maak vrij','Maak x of y vrij in één vergelijking.');

function renderSubstitute(){

}

/* ---------- COMBINATION ---------- */
function scaledEq(i,f){const e=equations()[i],F=q(f);return {x:e.x.mul(F),y:e.y.mul(F),c:e.c.mul(F)}}
function scaledRows(){return [scaledEq(0,state.factors[0]??1),scaledEq(1,state.factors[1]??1)]}
function factorReady(){if(state.factors.some(v=>v===null))return null;const [a,b]=scaledRows(),sx=a.x.add(b.x),sy=a.y.add(b.y),sc=a.c.add(b.c);if(sx.zero()&&sy.zero())return {special:true,rhs:sc};if(sx.zero())return {special:false,elim:'x',found:'y',coef:sy,rhs:sc,val:sc.div(sy)};if(sy.zero())return {special:false,elim:'y',found:'x',coef:sx,rhs:sc,val:sc.div(sx)};return null}
function combinationReferenceHTML(){const rows=originalRows();return `<div class="comb-original-ref"><div class="ref-brace">{</div><div class="ref-eqs">${rows.map(r=>`<div class="ref-row"><span class="lhs">${r.lhs}</span><span class="eq">=</span><span class="rhs">${r.rhs}</span></div>`).join('')}</div></div>`}
function renderCombination(){if(state.phase===1)return renderFactors();if(state.phase===2)return renderAdd();if(state.phase===3)return renderCombBackOrConclusion();renderCombPair()}
function renderFactors(){
  setInstruction('1 · kies factoren','Sleep of tik factoren zodat één variabele wegvalt.');const rows=originalRows();systemWrap.innerHTML=`<div class="factor-layout"><div class="factor-system"><div class="brace">{</div><div class="factor-eqs">${rows.map((r,i)=>`<div class="factor-row"><span class="lhs">${r.lhs}</span><span class="eq">=</span><span>${r.rhs}</span><span class="factor-box">× <span class="drop-target factor-slot ${state.factors[i]!==null?'filled':''}" id="fs${i}" data-row="${i}">${state.factors[i]===null?'·':state.factors[i]}</span></span></div>`).join('')}</div></div></div>`;auxArea.innerHTML=`<div><div class="factor-rail">${[-4,-3,-2,-1,1,2,3,4].map(v=>`<div class="factor-chip" data-f="${v}">${v<0?'−'+Math.abs(v):v}</div>`).join('')}</div><div class="factor-feedback">${state.factorMessage}</div></div>`;
  $$('.factor-chip').forEach(ch=>moveControl(ch,ch.innerHTML,['#fs0','#fs1'],t=>transition(()=>{state.factors[Number(t.dataset.row)]=Number(ch.dataset.f);state.factorMessage='';const r=factorReady();if(r){state.elim=r;state.snapshots[1]={type:'rows',rows:scaledRows().map(e=>({lhs:linearHTML(e),rhs:qHTML(e.c)}))};state.phase=2}else if(state.factors.every(v=>v!==null)){const [a,b]=scaledRows(),sum={x:a.x.add(b.x),y:a.y.add(b.y),c:a.c.add(b.c)};state.factorMessage=`Na optellen: ${mathText(linearHTML(sum))} = ${qPlain(sum.c)}. Nog geen variabele valt weg.`}})))
}
function additionHTML(){
  const [a,b]=scaledRows(),s={x:a.x.add(b.x),y:a.y.add(b.y),c:a.c.add(b.c)};
  const cell=(key,v)=>{const done=state.sumDone[key],top=key==='c'?qHTML(a.c):signedTerm(a[key],v,true),bot=key==='c'?qHTML(b.c):signedTerm(b[key],v,true),sum=key==='c'?qHTML(s.c):(signedTerm(s[key],v,true)||'0');return {top:done?top:`<span class="drag-source" id="as_${key}">${top}</span>`,bot:done?bot:`<span class="drop-target" id="at_${key}">${bot}</span>`,sum:done?sum:'<span class="pending">·</span>'}};
  const x=cell('x','x'),y=cell('y','y'),c=cell('c',''),all=state.sumDone.x&&state.sumDone.y&&state.sumDone.c;let rx=x.sum,ry=y.sum,rc=c.sum;if(all&&!state.elim.special){if(state.elim.found==='x')rx=`<span class="drag-source" id="elimCoef">${qHTML(state.elim.coef)}</span>x`;else ry=`<span class="drag-source" id="elimCoef">${qHTML(state.elim.coef)}</span>y`;rc=`<span class="drop-target" id="elimRhs">${qHTML(state.elim.rhs)}</span>`}
  return `<div class="addition-board"><div class="addition-row"><div>${x.top}</div><div>${y.top}</div><div>=</div><div>${c.top}</div></div><div class="addition-row"><div>${x.bot}</div><div>${y.bot}</div><div>=</div><div>${c.bot}</div></div><div class="addition-line"></div><div class="addition-row result"><div>${rx}</div><div>${ry}</div><div>=</div><div>${rc}</div></div></div>`
}
function afterAddTerm(){const all=state.sumDone.x&&state.sumDone.y&&state.sumDone.c;if(!all)return;if(state.elim.special){state.snapshots[2]={type:'text',text:`0 = ${qPlain(state.elim.rhs)}`};state.phase=3}else if(state.elim.coef.one()){state.snapshots[2]={type:'text',text:`${state.elim.found} = ${qPlain(state.elim.val)}`};state.phase=3}}
function renderAdd(){
  setInstruction('2 · tel op','Breng de termen verticaal samen.');systemWrap.innerHTML=`<div class="comb-add-stage">${combinationReferenceHTML()}${additionHTML()}</div>`;for(const k of ['x','y','c'])if(!state.sumDone[k])moveControl($('#as_'+k),$('#as_'+k).innerHTML,['#at_'+k],()=>transition(()=>{state.sumDone[k]=true;afterAddTerm()}));const all=state.sumDone.x&&state.sumDone.y&&state.sumDone.c;if(!all||state.phase!==2)return;setInstruction('2 · tel op',`Werk verder tot ${state.elim.found} alleen staat.`);moveControl($('#elimCoef'),qHTML(state.elim.coef),['#elimRhs'],()=>transition(()=>{state.snapshots[2]={type:'text',text:`${state.elim.found} = ${qPlain(state.elim.val)}`};state.phase=3}))
}
function completeCombBack(foundVar,foundVal,other,otherVal){state.snapshots[3]={type:'rows',rows:[{lhs:other,rhs:qHTML(otherVal)},{lhs:foundVar,rhs:qHTML(foundVal)}]};state.phase=4}
function renderCombBackOrConclusion(){
  if(state.elim.special){setInstruction('3 · conclusie',`Wat betekent 0 = ${qPlain(state.elim.rhs)}?`);systemWrap.innerHTML=`<div class="special-result">0 = ${qHTML(state.elim.rhs)}</div>`;auxArea.innerHTML='<div class="special-choice"><button data-a="infinite">oneindig veel oplossingen</button><button data-a="none">geen oplossing</button></div>';$$('[data-a]').forEach(b=>b.addEventListener('click',()=>{const ok=(state.elim.rhs.zero()&&b.dataset.a==='infinite')||(!state.elim.rhs.zero()&&b.dataset.a==='none');if(!ok){showToast('Kijk naar de gelijkheid.',true);return}transition(()=>{const result=state.elim.rhs.zero()?'oneindig veel oplossingen':'geen oplossing';state.snapshots[3]={type:'text',text:result};state.snapshots[4]={type:'text',text:result};state.solved=true;axiomaStelselsSolved();state.phase=4})}));return}
  const foundVar=state.elim.found,foundVal=state.elim.val,other=foundVar==='x'?'y':'x';setInstruction('3 · vervang waarde',state.chosenEq===null?'Kies één oorspronkelijke vergelijking.':'Vervang de gevonden waarde.');
  if(state.chosenEq===null){const rows=originalRows(),source=`<div class="choice-system"><div class="choice-brace">{</div><div class="choice-eqs">${rows.map((r,i)=>`<div class="choice-row choice-source" id="ce${i}" data-i="${i}"><span class="lhs">${r.lhs}</span><span class="eq">=</span><span class="rhs">${r.rhs}</span></div>`).join('')}</div></div>`,target=`<div class="choice-system"><div class="choice-brace">{</div><div class="choice-eqs"><div class="choice-drop drop-target" id="choiceDrop">sleep of tik een vergelijking hier</div><div class="choice-row choice-fixed"><span class="lhs">${foundVar}</span><span class="eq">=</span><span class="rhs">${qHTML(foundVal)}</span></div></div></div>`;systemWrap.innerHTML=`<div class="original-choice">${source}<div class="choice-arrow">→</div>${target}</div>`;[0,1].forEach(i=>moveControl($('#ce'+i),$('#ce'+i).innerHTML,['#choiceDrop'],()=>{const e=equations()[i];if(e[other].zero()){showToast('Kies de andere vergelijking: deze bevat de overblijvende variabele niet.',true);return}transition(()=>{state.chosenEq=i;state.backStage=e[foundVar].zero()?2:0})}));return}
  const e=equations()[state.chosenEq],cf=e[foundVar],co=e[other],prod=cf.mul(foundVal),remaining=e.c.sub(prod),otherVal=remaining.div(co);
  if(state.backStage===0){const target=`<span class="drop-target soft-target" id="cv">${foundVar}</span>`,lhs=`${signedTerm(co,other,true)} ${cf.n<0?'−':'+'} ${cf.abs().one()?target:`${qHTML(cf.abs())}${target}`}`;systemWrap.innerHTML=systemHTML([{lhs,rhs:qHTML(e.c)},{lhs:foundVar,rhs:`<span class="drag-source" id="fv">${qHTML(foundVal)}</span>`}],{focus:0});moveControl($('#fv'),qHTML(foundVal),['#cv'],()=>transition(()=>{state.backStage=cf.abs().one()?2:1}));return}
  if(state.backStage===1){systemWrap.innerHTML=systemHTML([{lhs:`${signedTerm(co,other,true)} ${cf.n<0?'−':'+'} <span class="drag-source" id="cm">${qHTML(cf.abs())}</span><span class="mul-dot">.</span><span class="drop-target" id="fm">${qHTML(foundVal)}</span>`,rhs:qHTML(e.c)},{lhs:foundVar,rhs:qHTML(foundVal)}],{focus:0});moveControl($('#cm'),qHTML(cf.abs()),['#fm'],()=>transition(()=>{state.backStage=2}));return}
  if(state.backStage===2){if(prod.zero()){systemWrap.innerHTML=systemHTML([{lhs:signedTerm(co,other,true),rhs:qHTML(e.c)},{lhs:foundVar,rhs:qHTML(foundVal)}],{focus:0});auxArea.innerHTML='<button class="continue-btn" id="skipProd">VERDER</button>';$('#skipProd').addEventListener('click',()=>transition(()=>{if(co.one())completeCombBack(foundVar,foundVal,other,otherVal);else state.backStage=3}));return}systemWrap.innerHTML=systemHTML([{lhs:`${signedTerm(co,other,true)} <span class="drag-source" id="prod">${prod.n<0?'− ': '+ '}${qHTML(prod.abs())}</span>`,rhs:`<span class="drop-target" id="crhs">${qHTML(e.c)}</span>`},{lhs:foundVar,rhs:qHTML(foundVal)}],{focus:0});moveControl($('#prod'),$('#prod').innerHTML,['#crhs'],()=>transition(()=>{if(co.one())completeCombBack(foundVar,foundVal,other,otherVal);else state.backStage=3}));return}
  systemWrap.innerHTML=systemHTML([{lhs:`<span class="drag-source" id="oc">${qHTML(co)}</span>${other}`,rhs:`<span class="drop-target" id="orhs">${qHTML(remaining)}</span>`},{lhs:foundVar,rhs:qHTML(foundVal)}],{focus:0});moveControl($('#oc'),qHTML(co),['#orhs'],()=>transition(()=>completeCombBack(foundVar,foundVal,other,otherVal)))
}
function renderCombPair(){
  if(state.elim.special){setInstruction('4 · oplossing','');systemWrap.innerHTML=`<div class="special-result">${info().solutionText}</div>`;return}
  const s=sol();setInstruction('4 · oplossing','Sleep de gevonden waarden naar het geordende paar.');systemWrap.innerHTML=systemHTML([{lhs:'x',rhs:`<span class="drag-source" id="cx">${qHTML(s.x)}</span>`},{lhs:'y',rhs:`<span class="drag-source" id="cy">${qHTML(s.y)}</span>`}]);auxArea.innerHTML=`<div class="pair-line"><span>(x,y) = (</span><span class="pair-slot ${state.pair.x!==null?'filled':''}" id="px">${state.pair.x!==null?qHTML(state.pair.x):'·'}</span><span>,</span><span class="pair-slot ${state.pair.y!==null?'filled':''}" id="py">${state.pair.y!==null?qHTML(state.pair.y):'·'}</span><span>)</span></div>`;const drop=(value,target)=>transition(()=>{if(target.id==='px')state.pair.x=value;else state.pair.y=value;if(state.pair.x!==null&&state.pair.y!==null&&state.pair.x.eq(s.x)&&state.pair.y.eq(s.y)){state.snapshots[4]={type:'text',text:`(x,y)=(${qPlain(s.x)},${qPlain(s.y)})`};state.solved=true;axiomaStelselsSolved()}});moveControl($('#cx'),qHTML(s.x),['#px','#py'],t=>drop(s.x,t));moveControl($('#cy'),qHTML(s.y),['#px','#py'],t=>drop(s.y,t))
}

/* ---------- events ---------- */
exerciseSelect.innerHTML=EXERCISES.map((e,i)=>`<option value="${i}">${e.id}</option>`).join('');
exerciseSelect.addEventListener('change',()=>{exerciseIndex=Number(exerciseSelect.value);reset()});
$$('.method-tab').forEach(b=>b.addEventListener('click',()=>{if(method===b.dataset.method)return;method=b.dataset.method;reset()}));
$$('.study-mode-btn').forEach(b=>b.addEventListener('click',()=>{if(studyMode===b.dataset.studyMode)return;studyMode=b.dataset.studyMode;reset()}));
undoBtn.addEventListener('click',undo);$('#resetBtn').addEventListener('click',reset);reset();
})();
</script>

<style id="axioma-simple-integration-css">
.axioma-platform-inline{cursor:pointer;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;letter-spacing:.08em;font-weight:900}
.axioma-platform-inline:focus-visible{outline:2px solid currentColor;outline-offset:3px}
</style>
<script id="axioma-simple-integration">
(()=>{
'use strict';
const GAME_ID="stelsels";
const PROGRESS_KEY=`axioma:game:${GAME_ID}:progress`;
const COMPLETE_KEY=`axioma:game:${GAME_ID}:complete`;
function emit(completed,total,current=null){
  completed=Math.max(0,Number(completed)||0); total=Math.max(0,Number(total)||0);
  if(total)completed=Math.min(completed,total);
  const payload={type:'axioma:game-progress',gameId:GAME_ID,completed,total,current:Number.isFinite(+current)?+current:null,complete:!!total&&completed>=total,updatedAt:new Date().toISOString()};
  try{localStorage.setItem(PROGRESS_KEY,JSON.stringify(payload)); if(payload.complete)localStorage.setItem(COMPLETE_KEY,'1'); else localStorage.removeItem(COMPLETE_KEY)}catch(_){}
  try{window.dispatchEvent(new CustomEvent('axioma:game-progress',{detail:payload}))}catch(_){}
  try{if(parent&&parent!==window)parent.postMessage(payload,'*')}catch(_){}
  return payload;
}
function homeUrl(){
  const q=new URLSearchParams(location.search).get('axiomaHome'); if(q){try{return new URL(q,location.href).href}catch(_){}}
  const u=new URL(location.href); const p=u.pathname; const i=p.indexOf('/games/');
  u.pathname=i>=0?p.slice(0,i+1)+'index.html':p.replace(/[^/]*$/,'index.html'); u.search='';u.hash=''; return u.href;
}
function goHome(e){if(e){e.preventDefault();e.stopPropagation();} const url=homeUrl(); try{if(parent&&parent!==window)parent.postMessage({type:'axioma:navigate-home',gameId:GAME_ID,url},'*')}catch(_){} try{if(top&&top!==window){top.location.href=url;return}}catch(_){} location.href=url;}
function wire(el){if(!el||el.dataset.axiomaHomeWired)return;el.dataset.axiomaHomeWired='1';el.classList.add('axioma-platform-inline');el.setAttribute('role','link');el.setAttribute('tabindex','0');el.title='Terug naar Axioma';el.addEventListener('click',goHome,true);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')goHome(e)})}
window.AxiomaSimple={gameId:GAME_ID,report:emit,home:goHome};
const b=document.querySelector('.brand');if(b){b.textContent='AXIOMA';wire(b)}

const K='axioma.stelsels.completed.v1';let set=new Set();try{set=new Set(JSON.parse(localStorage.getItem(K)||'[]').filter(Number.isInteger))}catch(_){}
function sync(){try{localStorage.setItem(K,JSON.stringify([...set].sort((a,b)=>a-b)))}catch(_){} emit(set.size,14,null)}
addEventListener('axioma:stelsels-solved',e=>{set.add(Number(e.detail?.exerciseIndex));sync()});sync();

})();
</script>
