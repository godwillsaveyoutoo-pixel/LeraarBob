*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0f2433;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}
button{font:inherit}
button:focus-visible{outline:3px solid rgba(67,143,229,.35);outline-offset:2px}
.app{width:100%;height:100%;display:grid;grid-template-rows:50px minmax(0,1fr) var(--dock-h);background:linear-gradient(180deg,#d7d2cc,#ebe8e2 48%,#d6d2cc);overflow:hidden}
.topbar{height:50px;background:linear-gradient(180deg,#1d2e41,#132437);color:#fff;display:grid;grid-template-columns:minmax(150px,1fr) auto minmax(150px,1fr);align-items:center;padding:0 var(--s3);gap:10px;border-bottom:1px solid rgba(255,255,255,.16);box-shadow:0 3px 12px rgba(5,16,27,.3);z-index:5}
.brand{font-weight:1000;letter-spacing:.025em;display:flex;align-items:center;gap:8px;white-space:nowrap;min-width:0}.brand:before{content:"";flex:0 0 auto;width:25px;height:25px;border-radius:7px;background:linear-gradient(135deg,#2787df 0 48%,#e9eef1 49% 60%,#f2b817 61%);transform:rotate(45deg);box-shadow:0 2px 5px #07131f}
.leveltitle{font-size:var(--text-sm);font-weight:900;opacity:.88;white-space:nowrap}
.orderbox{height:38px;display:flex;align-items:center;gap:16px;padding:0 18px;color:#17283c;background:linear-gradient(180deg,#fff,#e7e5e1);border:1px solid rgba(255,255,255,.7);border-radius:10px;box-shadow:0 3px 10px rgba(0,0,0,.25),inset 0 1px #fff;font-weight:1000}.orderbox span{font-size:11px;letter-spacing:.06em}.orderbox strong{font-size:19px;white-space:nowrap}.orderbox i{width:1px;height:24px;background:#aeb3b6}
.top-actions{justify-self:end;display:flex;gap:6px}
.iconbtn{width:var(--touch);height:var(--touch);border:1px solid rgba(255,255,255,.2);border-radius:12px;background:rgba(255,255,255,.035);color:#fff;font-size:19px;font-weight:1000}
.workspace{position:relative;min-height:0;overflow:hidden}
.view{position:absolute;inset:0;transition:transform .38s cubic-bezier(.2,.75,.2,1),opacity .25s ease}
.view.offleft{transform:translateX(-100%);opacity:.15}
.view.offright{transform:translateX(100%);opacity:.15}
.qa .view{transition:none}
.machine,.math{padding:var(--s2) var(--s3)}
.machine{background-image:linear-gradient(180deg,rgba(255,248,232,.08),rgba(72,48,34,.14)),var(--workshop-bg);background-size:cover;background-position:center 52%;background-repeat:no-repeat}.machine:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 28%,rgba(255,249,227,.12),transparent 48%),linear-gradient(90deg,rgba(20,14,12,.1),transparent 16%,transparent 84%,rgba(20,14,12,.1))}.machine:after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 14px 24px rgba(255,240,205,.1),inset 22px 0 28px rgba(24,16,13,.08),inset -22px 0 28px rgba(24,16,13,.08)}
.math{background-image:linear-gradient(180deg,rgba(255,252,242,.05),rgba(73,48,25,.08)),var(--worktable-bg);background-size:cover;background-position:center;background-repeat:no-repeat}
.tanks{height:100%;display:grid;gap:clamp(10px,3vw,44px);align-items:start;justify-content:center}
.machine .tanks{position:relative}
.pipe-net{position:absolute;left:0;top:0;width:100%;height:230px;z-index:0;pointer-events:none;overflow:visible}.pipe-net path{fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}.pipe-shell{stroke:#4e565b;stroke-width:13;filter:drop-shadow(0 3px 2px rgba(26,34,39,.35))}.pipe-metal{stroke:url(#pipeSteel);stroke-width:9}.pipe-shine{stroke:rgba(255,255,255,.42);stroke-width:2;transform:translateY(-2px)}.pipe-liquid{opacity:0;stroke:var(--flow,#368fca);stroke-width:5}.pipe-liquid.live{opacity:1;stroke-dasharray:12 7;animation:pipeflow .28s linear infinite}@keyframes pipeflow{to{stroke-dashoffset:-19}}
.tanks.n2{grid-template-columns:minmax(150px,1fr) minmax(172px,1.12fr) minmax(150px,1fr)}
.tanks.n3{grid-template-columns:repeat(2,minmax(125px,1fr)) minmax(150px,1.08fr) minmax(125px,1fr);gap:clamp(6px,1.8vw,28px)}
.tankcol{display:grid;grid-template-rows:19px 13px var(--tank-h) 42px 46px;justify-items:center;align-items:center;gap:1px;min-width:0;position:relative;z-index:1}
.tankname{font-size:var(--text-md);font-weight:1000;line-height:1;color:#fff;text-transform:uppercase;padding:3px 15px;border-radius:5px 5px 2px 2px;background:linear-gradient(#528f59,#347b42);box-shadow:inset 0 1px rgba(255,255,255,.5),0 2px 3px rgba(0,0,0,.2)}
.tankname.b{background:linear-gradient(#438ac5,#296a9f)}.tankname.c{background:linear-gradient(#dfa817,#ad7900)}.tankname.goal{background:linear-gradient(#3378bd,#165694)}
.stock{font-size:var(--text-xs);font-weight:850;color:#384c5c;white-space:nowrap;background:rgba(255,248,232,.76);padding:0 5px;border-radius:5px;text-shadow:0 1px rgba(255,255,255,.55)}
.tank-stage{width:var(--tank-w);height:var(--tank-h);display:flex;align-items:flex-end;justify-content:center;position:relative}
.tank{
  width:var(--tank-scale,100%);height:var(--tank-scale,100%);border:7px solid #8e8b88;border-radius:15px 15px 20px 20px;
  position:relative;overflow:hidden;background:linear-gradient(90deg,#bac6ca,#f2f4f3 14%,#bdc9cd 70%,#839196);box-shadow:inset 0 0 0 2px #e7e1d7,inset 0 1px 0 #fff,0 5px 8px rgba(39,39,36,.22)
}
.tank.hero{border-color:#7f8586}
.tank:before{content:"";position:absolute;inset:8px 7px 7px;border-radius:7px 7px 12px 12px;background:linear-gradient(90deg,rgba(255,255,255,.36),transparent 24%,rgba(255,255,255,.1));z-index:3;border:1px solid rgba(255,255,255,.45);pointer-events:none}
.tank:after{content:"";position:absolute;left:-9px;right:-9px;bottom:9px;height:7px;background:linear-gradient(#d7d2ca,#706c69 48%,#bcb7af);border-radius:4px;z-index:4}
.paint{position:absolute;left:6px;right:6px;bottom:7px;border-radius:7px 7px 11px 11px;height:64%;transition:height .72s cubic-bezier(.2,.8,.2,1);box-shadow:inset 9px 0 rgba(255,255,255,.14),inset -6px 0 rgba(0,0,0,.08)}.paint:after{content:"";position:absolute;left:0;right:0;top:-2px;height:5px;border-radius:50%;background:rgba(255,255,255,.3);animation:surface 1.4s ease-in-out infinite alternate}@keyframes surface{to{transform:translateY(1px) scaleX(.96)}}
.paint.mixA{background:linear-gradient(180deg,#42b774,#2fa05d)}
.paint.mixB{background:linear-gradient(180deg,#45aeb1,#2c9a9d)}
.paint.mixEqual{background:linear-gradient(180deg,#658fba,#47779e)}
.paint.blue{background:linear-gradient(180deg,#4a99eb,#347fc9)}
.paint.yellow{background:linear-gradient(180deg,#f6d03e,#e9b920)}
.paint.goalPaint{background:linear-gradient(180deg,#9657b7,#643282)}
.pipe-local{height:42px;display:flex;align-items:center;justify-content:center;position:relative}.pipe-local:before{content:"";position:absolute;top:-5px;width:30px;height:13px;border:4px solid #6f706f;border-top:0;border-radius:0 0 7px 7px;background:#c4c1bb}.pipe-local .stem{width:10px;height:40px;border-radius:2px;background:linear-gradient(90deg,#ddd9d2,#6d6d6c 48%,#c7c3bc);z-index:1}.valve{position:absolute;left:50%;top:0;width:58px;height:44px;transform:translateX(-50%);border:0;background:transparent;z-index:4;cursor:grab;touch-action:none}.valve:active{cursor:grabbing}.valve span{position:absolute;left:7px;top:13px;width:44px;height:10px;border:1px solid #76520d;border-radius:6px;background:linear-gradient(#f1c34b,#a76c06 62%,#d79b1c);box-shadow:0 2px 3px rgba(0,0,0,.35),inset 0 1px rgba(255,255,255,.55);transition:transform .16s cubic-bezier(.2,.9,.3,1);transform:rotate(var(--valve-angle,0deg))}.valve span:after{content:"";position:absolute;left:15px;top:-4px;width:12px;height:12px;border:2px solid #e9be50;border-radius:50%;background:#654718;box-shadow:0 1px 2px rgba(0,0,0,.35)}.tankcol.flowing .valve span{transform:rotate(90deg)}.valve:focus-visible{outline:3px solid rgba(39,135,223,.45);outline-offset:-3px}
.pipe-local .badge{display:none}
.pipe-local.a .badge{color:#287a50;border-color:#badbc6}.pipe-local.b .badge{color:#356f9f;border-color:#bed3e4}.pipe-local.c .badge{color:#957000;border-color:#ead47f}
.unitrow,.goalunit{display:flex;align-items:center;justify-content:center;gap:5px;min-height:30px}
.unitlabel{font-size:10px;font-weight:1000;color:#6d8393}
.block{height:30px;display:grid;grid-auto-flow:column;grid-auto-columns:var(--cell-w);gap:var(--cell-gap);padding:var(--block-pad);border:1px solid #aeb7bd;border-radius:7px;background:linear-gradient(#fff,#e7e7e4);box-shadow:0 2px 3px rgba(26,39,50,.16)}
.cell{min-width:0;border-radius:4px;position:relative}
.cell.blue{background:var(--blue)}.cell.yellow{background:var(--yellow)}
.cell.blue:after{content:"•";color:rgba(255,255,255,.55);position:absolute;inset:0;display:grid;place-items:center;font-size:8px}
.cell.yellow:after{content:"—";color:rgba(255,255,255,.58);position:absolute;inset:0;display:grid;place-items:center;font-size:8px}
.machine-layout{height:100%;display:grid;grid-template-rows:minmax(0,1fr) 22px;gap:4px;position:relative;z-index:1}.machine-status{text-align:center;min-height:20px;font-size:11px;font-weight:900;color:#52687a;padding:3px 12px;border-radius:99px;background:rgba(248,248,246,.78);border:1px solid rgba(255,255,255,.62);box-shadow:0 1px 3px rgba(45,55,60,.12);justify-self:center}.machine-status.ok{color:#26754c}.machine-status.bad{color:#a64049}
.source-step{width:126px;height:var(--touch);display:grid;grid-template-columns:var(--touch) 1fr var(--touch);align-items:center;border:1px solid #9aa6ad;border-radius:10px;background:linear-gradient(#faf9f6,#deddda);overflow:hidden;box-shadow:0 2px 4px rgba(0,0,0,.18);z-index:2}
.source-step button{height:var(--touch);border:0;background:rgba(255,255,255,.42);color:#1d4157;font-size:21px;font-weight:1000}.source-step button:first-child{border-right:1px solid #c0c6c9}.source-step button:last-child{border-left:1px solid #c0c6c9}
.source-step .value{text-align:center;font-size:14px;font-weight:1000}

/* =========================================================
   v0.18.1 — Compact vat racks + stable 4-column sizing
   - machine vats sit closer together
   - every source/goal column gets an equal bounded track
   - prevents vat C / last column from stretching abnormally
   ========================================================= */
.machine .tanks,
.mathscene .tanks{
  margin-inline:auto;
}

/* 2 source vats + goal */
.machine .tanks.n2{
  width:min(100%, 650px);
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:clamp(14px,2.1vw,24px);
}

/* 3 source vats + goal */
.machine .tanks.n3{
  width:min(100%, 760px);
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:clamp(8px,1.35vw,16px);
}

/* A grid track may be wide, but the actual machine module may not stretch with it. */
.machine .tankcol{
  width:100%;
  max-width:158px;
  justify-self:center;
}

/* Worktable uses the same bounded/equal-column rule so vat C cannot become
   an oversized or oddly centred column there either. */
.mathscene .tanks.n2{
  width:min(100%, 610px);
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:clamp(10px,1.8vw,18px);
}
.mathscene .tanks.n3{
  width:min(100%, 750px);
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:clamp(7px,1.15vw,13px);
}
.mathscene .tankcol{
  width:100%;
  max-width:132px;
  justify-self:center;
}

/* Keep the compact rack reliable at the Samsung-A20 landscape reference. */
@media(max-width:800px) and (orientation:landscape){
  .machine .tanks.n2{width:min(100%,620px);gap:12px}
  .machine .tanks.n3{width:min(100%,710px);gap:7px}
  .machine .tankcol{max-width:150px}

  .mathscene .tanks.n2{width:min(100%,590px);gap:9px}
  .mathscene .tanks.n3{width:min(100%,700px);gap:6px}
  .mathscene .tankcol{max-width:126px}
}


/* v0.18.2 — all source tanks share one clear readable size.
   Capacity stays visible in text/fill, not in tank geometry. */
.machine .tank-stage,
.mathscene .tank-stage{
  flex-shrink:0;
}

function layoutPipes(){

  const box=svg.getBoundingClientRect(),target=connector.getBoundingClientRect(),w=box.width,h=box.height;svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.setAttribute('preserveAspectRatio','none');

function renderMath(){

        <div class="strip">${state.goalSlots.map((c,i)=>`<button class="slot ${c?'filled':''} ${i===state.animSlot?'snap':''} ${c==='blue'?'goalblue':c==='yellow'?'goalyellow':''}" style="${slotStyle()}" data-goal="${i}">${c?targetBlock(c):'?'}</button>`).join('')}</div>

        <div class="compare ${math.dataset.ok==='1'?'good':lastMathMsg?'bad':''}">${lastMathMsg||sources().map((s,i)=>`${String.fromCharCode(65+i)} ${vals[i]} l`).join(' · ')}</div>
      </div>

function sendMathToMachine(){
  const vals=recipeCount(),left=vals.map((v,i)=>v-(state.used[i]||0));
  if(left.some(v=>v<0)){toast('Dit recept past niet meer bij wat al gegoten is. Herstel eerst het doel.');feedback('bad');return}
  state.pick=left;state.view='machine';lastMathMsg='';feedback('ok');render();toast(state.mixTotal?'Resterend recept naar de machine gestuurd.':'Recept naar machine gestuurd.');
}
function pour(onlySource=null){
  if(state.running)return;if(state.readyCheck){toast('Het doelvat is vol. Druk op CONTROLEER.');feedback('bad');return}
  const vals=state.pick.map((v,i)=>onlySource===null||i===onlySource?v:0),batch=simulatePick(vals),nextTotal=state.mixTotal+batch.total;
  if(vals.every(v=>v===0)){toast('Kies eerst verf.');feedback('bad');return}
  for(let i=0;i<vals.length;i++)if(!available(i).includes(vals[i])){toast(`Vat ${String.fromCharCode(65+i)} schenkt alleen per ${sourceStep(i)} l.`);feedback('bad');return}
  if(nextTotal>order().vol+1e-8){toast(`${fmt(nextTotal-order().vol)} l te veel voor het doelvat.`);feedback('bad');return}
  const nextRemain=state.remain.map((r,i)=>r-vals[i]),nextUsed=state.used.map((u,i)=>u+vals[i]);
  const rule=L().rule;if(rule&&nextRemain[rule.source]<rule.amount-1e-8){toast(rule.text);feedback('bad');return}

  vals.forEach((v,i)=>{if(v>0)sfx('pour',i)});

    nextRemain.forEach((r,i)=>{const p=machine.querySelector(`[data-source-paint="${i}"]`);if(p)p.style.height=sourceFill(i,r)+'%'});
    const goal=machine.querySelector('[data-goal-paint]');if(goal)goal.style.height=goalFill(nextTotal)+'%';
  }));
  setTimeout(()=>{
    state.remain=nextRemain;state.used=nextUsed;state.b=nextB;state.y=nextY;state.mixTotal=nextTotal;state.pick=state.pick.map((v,i)=>vals[i]>0?0:v);state.running=false;state.flowing=sources().map(()=>false);

    feedback('snap');
    render();
  },760);
}
function checkMixture(){

  state.readyCheck=false;
  if(!ratioCheck(state.b,state.y)){const db=state.b-targetBlue(),dy=state.y-targetYellow();state.fullError=db>0.01?'Doel vol: te veel blauw.':dy>0.01?'Doel vol: te veel geel.':db<-0.01?'Doel vol: te weinig blauw.':'Doel vol: te weinig geel.';feedback('bad')}
  else if(!futureFeasible(state.used,orderStartStock())){state.fullError='Goed mengsel, maar te weinig voorraad voor de volgende bestelling.';feedback('bad')}
  else{state.solved=true;feedback('ok')}

}
function retryOrder(){
  if(state.running||state.solved)return;if(state.mixTotal>0){clearGoal();return}
  state.pick=sources().map(()=>0);state.readyCheck=false;state.fullError='';resetMath();feedback('select');render();
}
function clearGoal(){
  if(state.running)return;state.running=true;state.flowing=sources().map(()=>false);render();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const g=machine.querySelector('[data-goal-paint]');if(g)g.style.height='0%';state.remain.forEach((r,i)=>{const p=machine.querySelector(`[data-source-paint="${i}"]`);if(p)p.style.height=sourceFill(i,r+state.used[i])+'%'})}));
  setTimeout(()=>{state.remain=state.remain.map((r,i)=>r+state.used[i]);state.used=sources().map(()=>0);state.pick=sources().map(()=>0);state.b=0;state.y=0;state.mixTotal=0;state.readyCheck=false;state.fullError='';state.running=false;resetMath();feedback('select');render()},650);
}
function advanceAfterSuccess(){
  if(state.order<L().orders.length-1){
    state.order++;resetOrder();feedback('ok');render();return;
  }
  progress.completed.add(state.level);persistVerfProgress();
  if(state.level<LEVELS.length-1){state.level++;resetLevel();feedback('ok')}else{toast('Alle bestellingen voltooid!');feedback('ok');render()}

function menuBucket(level){return level.sources.length===3?'three':'two'}
function currentMenuBucket(){return menuBucket(L())}
function groupMeta(group){return GROUP_META[group]||GROUP_META.two}

function levelSummary(level){const o=level.orders[0];return `${fmt(o.vol)} L · ${o.b} : ${o.y}`}

function renderMenu(){

  }).join('');

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1600)}
viewBtn.onclick=()=>{state.view=state.view==='machine'?'math':'machine';feedback('select');render()}
$('#menuBtn').onclick=()=>{menuGroup=currentMenuBucket();$('#menu').classList.add('open');renderMenu()};

/* URL-only QA state, e.g. ?qa=1&level=9&view=math&phase=1. No effect in normal play. */

  app.classList.add('qa');
  state.level=Math.max(0,Math.min(LEVELS.length-1,Number(qa.get('level')||1)-1));resetLevel();

<script type="text/axioma-game" id="vfWebsiteMobileShellJS">
(()=>{
  'use strict';
  /* Presentation shell only: never changes LEVELS, state math, pour logic,
     validation, level progression, render functions or event contracts. */
  const body=document.body, app=document.getElementById('app');
  if(!app)return;
  body.classList.add('vf-intro-open');

  const intro=document.createElement('section');
  intro.className='vf-intro';intro.id='vfIntro';intro.setAttribute('aria-label','Verfwinkel startscherm');
  intro.innerHTML=`
    <div class="vf-intro-inner">
      <div class="vf-intro-copy">
        <div class="vf-kicker">leraarBob · MENGWERKPLAATS</div>
        <h1>Verfwinkel<span>verhouding wordt verf</span></h1>
        <p>Meng een bestelling uit echte voorraden. Wat je kiest, stroomt door de machine — en de verhouding moet kloppen.</p>
        <div class="vf-intro-actions">
          <button class="vf-start" id="vfStart">START BESTELLING</button>
          <button class="vf-levels" id="vfLevels">KIES BESTELLING</button>
        </div>

      </div>

        <div class="vf-rig-pipes"></div><div class="vf-rig-floor"></div>

          <div class="vf-mini-tank" data-label="VAT A"><div class="vf-mini-fill a"></div></div>
          <div class="vf-mini-tank" data-label="VAT B"><div class="vf-mini-fill b"></div></div>
          <div class="vf-mini-tank goal" data-label="BESTELLING"><div class="vf-mini-fill goal"></div></div>
        </div>
        <div class="vf-rig-arrow">MENG · CONTROLEER · LEVER</div>
      </div>
    </div>`;
  document.body.appendChild(intro);

  const grip=document.createElement('button');grip.className='vf-hud-grip';grip.type='button';grip.setAttribute('aria-label','Toon bovenbalk');app.appendChild(grip);
  const orderPeek=document.createElement('div');orderPeek.className='vf-order-peek';orderPeek.setAttribute('aria-hidden','true');app.appendChild(orderPeek);

  const orderVol=document.getElementById('orderVol'),orderRatio=document.getElementById('orderRatio'),menu=document.getElementById('menu'),topbar=app.querySelector('.topbar');
  const syncPeek=()=>{orderPeek.textContent=[orderVol?.textContent,orderRatio?.textContent].filter(Boolean).join('  ·  ')};
  syncPeek();
  const textObs=new MutationObserver(syncPeek);if(orderVol)textObs.observe(orderVol,{childList:true,subtree:true,characterData:true});if(orderRatio)textObs.observe(orderRatio,{childList:true,subtree:true,characterData:true});

  let hudTimer=0;
  const closeHud=()=>{body.classList.remove('vf-hud-open');clearTimeout(hudTimer)};
  const openHud=(auto=true)=>{if(body.classList.contains('vf-menu-active'))return;body.classList.add('vf-hud-open');clearTimeout(hudTimer);if(auto)hudTimer=setTimeout(closeHud,3000)};
  grip.addEventListener('click',()=>openHud(true));
  topbar?.addEventListener('pointerdown',()=>{clearTimeout(hudTimer)});
  topbar?.addEventListener('pointerup',()=>{clearTimeout(hudTimer);hudTimer=setTimeout(closeHud,3000)});

  let edgeStart=null;
  window.addEventListener('pointerdown',e=>{if(e.clientY<=24&&!body.classList.contains('vf-intro-open'))edgeStart={y:e.clientY,x:e.clientX}}, {passive:true});
  window.addEventListener('pointerup',e=>{if(!edgeStart)return;const dy=e.clientY-edgeStart.y;edgeStart=null;if(dy>18)openHud(true)}, {passive:true});

  const syncMenu=()=>{const active=!!menu?.classList.contains('open');body.classList.toggle('vf-menu-active',active);if(active)closeHud()};
  const menuObs=new MutationObserver(syncMenu);if(menu)menuObs.observe(menu,{attributes:true,attributeFilter:['class']});syncMenu();

  const requestImmersive=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen?.()}catch(_){}try{await screen.orientation?.lock?.('landscape')}catch(_){}};
  const enterGame=async(openLevels=false)=>{
    body.classList.remove('vf-intro-open');body.classList.add('vf-immersive');intro.hidden=true;
    await requestImmersive();
    if(openLevels){menu?.classList.add('open');syncMenu()}else{menu?.classList.remove('open');syncMenu();setTimeout(()=>openHud(false),120);setTimeout(closeHud,1500)}
  };

  const q=new URLSearchParams(location.search);if(q.get('qa')==='1'||q.has('level')){body.classList.remove('vf-intro-open');body.classList.add('vf-immersive');intro.hidden=true}

  document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&body.classList.contains('vf-immersive'))closeHud()});
})();
