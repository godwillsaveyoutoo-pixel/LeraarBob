<text x="75" y="1140" font-size="19" fill="#25433b" font-weight="600" >Samen leren   ·   Duo op één scherm   ·   Online duel   ·   Met de klas</text>
<text x="75" y="1164" font-size="14" fill="#526d60" font-weight="400" >Een kleine gebiedsplaats opent deze keuzes. Solo blijft altijd bereikbaar.</text>
<text x="32" y="1250" font-size="19" fill="#25433b" font-weight="600" >Ontwerpbesluit: gezamenlijk oplossen geeft oefenbewijs; een eigen eindcheck laat zien wat ieder begrijpt.</text>
<text x="32" y="1282" font-size="15" fill="#526d60" font-weight="400" >Alle maten zijn ontwerprichtingen. Touch, breuken, toetsenbord en open/dichte topbar worden in de volgende prototypefase getest.</text>
