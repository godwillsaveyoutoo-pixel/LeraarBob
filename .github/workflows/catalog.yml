name: Catalogus controleren

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node scripts/build-catalog.cjs --check
      - run: node --test tests/catalog.test.cjs tests/catalog-progress.test.cjs
